name: CI
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- tests/e2e/workflow-v2.spec.mjs
      - name: Reproduce original v0.6 regressions
        run: BASELINE=1 npm run test:e2e -- --grep "group at edge|invalid import|export escapes"
      - name: Package release assets
        run: node scripts/package-release.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: chromium-results
          path: |
            test-results/
            baseline-results/
          retention-days: 14

      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: kaigi-note-app
          path: dist/
          retention-days: 14

      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: kaigi-note-release
          path: release/
          retention-days: 14

  publish:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref_type == 'tag' && github.ref_name || 'latest-dev' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: kaigi-note-release
          path: release/
      - name: Publish tested release assets
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}

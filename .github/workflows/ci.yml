name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Reproduce original v0.6 regressions
        run: BASELINE=1 npm run test:e2e -- --grep "group at edge|invalid import|export escapes"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-results
          path: |
            test-results/
            baseline-results/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ui-studio-app
          path: dist/
          retention-days: 14
